[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-builder"
version = "0.1.1"
description = "Interview-driven Hermes Agent bootstrapper"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ZETTAI" }]
dependencies = []

[project.scripts]
hermes-builder = "hermes_builder.__main__:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
