name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Unit tests
        shell: bash
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python
        shell: bash
        run: PYTHONPATH=src python -m compileall -q src tests

  installers:
    name: Installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax
        run: bash -n install.sh
      - name: ShellCheck
        run: shellcheck install.sh
      - name: Local installer E2E
        run: bash tests/install_e2e.sh

  powershell:
    name: PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
      - name: Installer dry run
        shell: pwsh
        run: ./install.ps1 -DryRun
      - name: Windows installer smoke
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "hermes-builder-smoke"
          $env:HERMES_HOME = Join-Path $testRoot "hermes"
          $env:HERMES_BUILDER_HOME = Join-Path $testRoot "builder"
          $env:HERMES_BUILDER_BIN_DIR = Join-Path $testRoot "builder-bin"
          $fakeBin = Join-Path $testRoot "bin"
          New-Item -ItemType Directory -Force -Path $fakeBin | Out-Null
          @'
          @echo off
          if "%1 %2"=="profile show" exit /b 1
          exit /b 0
          '@ | Set-Content -Encoding ascii (Join-Path $fakeBin "hermes.cmd")
          $env:Path = "$fakeBin;$env:Path"
          $answers = Join-Path $testRoot "answers.json"
          @'
          {
            "profile_name": "windows-smoke",
            "display_name": "Windows Smoke",
            "purpose": "Windows installer smoke test",
            "use_cases": ["personal_assistant"],
            "autonomy": "interactive",
            "access_scope": "owner",
            "deployment": "laptop",
            "gateways": [],
            "integrations": []
          }
          '@ | Set-Content -Encoding utf8 $answers
          ./install.ps1 -SkipHermes -NonInteractive -Answers $answers -SourceDir $env:GITHUB_WORKSPACE
          & (Join-Path $env:HERMES_BUILDER_BIN_DIR "hermes-builder.cmd") --version

  full-install:
    name: Official Hermes full install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Hermes and apply Builder twice
        run: bash tests/docker/full_install.sh
